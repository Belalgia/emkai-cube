<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Board – Santa Frost</title>
<style>
:root {
  --board-size: 9;            /* echtes 9x9-Brett */
  --tile-gap: 4px;
  --tilt-start: 90deg;
  --tilt-end: 18deg;
  --anim-duration: 2000ms;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  height:100dvh;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(to bottom,#081226 0%,#0e1a3a 35%,#0b0f1e 100%);
  color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;perspective:1200px;padding:1dvh 0;
}

/* ❄️ Schnee */
.snow-container{position:fixed;top:0;left:0;right:0;height:35vh;overflow:hidden;pointer-events:none;z-index:0;}
.snowflake{position:absolute;top:-10px;background:white;border-radius:50%;opacity:.8;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(35vh);opacity:0;}}

/* === Santa & UI === */
.santaWrap{display:flex;flex-direction:column;align-items:center;gap:1dvh;z-index:2;margin:.5dvh 0;}
.speechBubble{
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);
  border-radius:16px;padding:1dvh 2dvw;font-size:clamp(12px,2.3vw,18px);line-height:1.4;
  width:min(85vw,600px);height:4.8em;text-align:center;overflow:hidden;opacity:0;
  transition:opacity .8s ease;display:flex;align-items:center;justify-content:center;
}

/* Feste, dreispaltige Anordnung: Slot – Santa – Slot (verhindert Verrutschen) */
.santaSection{
  display:grid;grid-template-columns:65px minmax(140px,1fr) 65px;align-items:center;gap:4dvw;
}
.pieceSlot{width:65px;height:65px;position:relative;display:flex;align-items:center;justify-content:center;}
.santaImgWrap{display:flex;align-items:center;justify-content:center;}
.santaSection img{width:clamp(100px,22vmin,200px);filter:drop-shadow(0 0 10px rgba(255,255,255,.3));}
.santaSection img[draggable="false"]{user-select:none;pointer-events:none;} /* absolut stabil */

/* Figuren (Palette oben, in Slots) */
.santaPiece{
  width:65px;height:65px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:#fff;cursor:grab;user-select:none;
  opacity:0;transform:scale(.7);transition:opacity 1s ease,transform .3s ease;
}
.santaPiece.show{opacity:1;transform:scale(1);}
.santaPiece.king{background:linear-gradient(145deg,#ffbf00,#cc9a00);}
.santaPiece.guard{background:linear-gradient(145deg,#5bc0de,#337ab7);}
.santaPiece.enemy{filter:brightness(.85);}

/* Wenn Figur auf einem Tile liegt: vollflächig, über dem Tile (sichtbar) */
.tile > .santaPiece.onboard{
  position:absolute;inset:0;width:100%;height:100%;aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;border-radius:8px;
  transform:rotateX(var(--tilt-end)) translateZ(3px);
  z-index:2;backface-visibility:hidden;
}

/* BOARD */
.board3d{
  width:96vw;max-width:600px;aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;
  perspective:1200px;margin:0 auto;max-height:60vh;
}
#board{
  display:grid;grid-template-columns:repeat(var(--board-size),1fr);
  grid-template-rows:repeat(var(--board-size),1fr);
  gap:var(--tile-gap);width:100%;height:100%;
  transform-style:preserve-3d;transform-origin:center bottom;
  transform:rotateX(var(--tilt-start));animation:tiltIn var(--anim-duration) ease-out forwards;
}
@keyframes tiltIn{from{transform:rotateX(var(--tilt-start));}to{transform:rotateX(var(--tilt-end));}}

/* Tiles */
.tile{
  position:relative;aspect-ratio:1/1;overflow:visible; /* wichtig: nichts abschneiden */
  background:linear-gradient(145deg,#51483e,#332d25);
  border:1px solid rgba(255,255,255,.1);border-radius:6px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .3s ease,box-shadow .3s ease;
}
.tile.center{
  background:radial-gradient(circle at center,#ff3300 0%,#7a0000 70%);
  border:2px solid rgba(255,120,0,1);box-shadow:0 0 35px rgba(255,100,0,.9);
  cursor:default!important;
}
.tile.highlight{
  box-shadow:0 0 15px 6px rgba(0,80,255,.6);
  background:linear-gradient(145deg,#3a4a6b,#1a2338);
  border:1px solid rgba(0,100,255,.6);
}

/* mobile */
@media (max-height:700px){.board3d{max-height:48vh;}}
</style>
</head>
<body>
<div class="snow-container" id="snow"></div>

<div class="santaWrap">
  <p class="speechBubble" id="speechBubble">Willkommen, Sterblicher. Die Mitternacht ist still, und der Schnee tanzt … 🎅</p>

  <div class="santaSection">
    <div class="pieceSlot">
      <div class="santaPiece king" draggable="true" id="king">👑</div>
    </div>

    <div class="santaImgWrap">
      <img id="santaImg" src="assets/opponent/santa1.png" alt="Santa Gegner" draggable="false" />
    </div>

    <div class="pieceSlot">
      <div class="santaPiece guard" draggable="true" id="guard">🛡️</div>
    </div>
  </div>
</div>

<div class="board3d"><div id="board"></div></div>

<script>
/* ===== Tiles & Board ===== */
class Tile{
  constructor(x,y,isCenter=false){
    this.x=x;this.y=y;this.el=document.createElement("div");
    this.el.className="tile";if(isCenter)this.el.classList.add("center");
    this.el.dataset.x=x;this.el.dataset.y=y;
  }
}
class Board{
  constructor(size=9){
    this.size=size;
    const center=Math.floor(size/2)+1; // 5 bei 9x9
    this.el=document.getElementById("board");
    this.tiles=[];
    for(let y=1;y<=size;y++){
      for(let x=1;x<=size;x++){
        const t=new Tile(x,y,(x===center&&y===center));
        this.el.appendChild(t.el);this.tiles.push(t);
      }
    }
  }
  getTile(x,y){return this.tiles.find(t=>t.x===x&&t.y===y);}
  neighborCoords(x,y){
    const n=[];for(let dy=-1;dy<=1;dy++){for(let dx=-1;dx<=1;dx++){
      if(dx===0&&dy===0)continue;const tx=x+dx,ty=y+dy;
      if(tx>=1&&tx<=this.size&&ty>=1&&ty<=this.size)n.push([tx,ty]);
    }}return n;
  }
  hasNeighborPiece(x,y){
    return this.neighborCoords(x,y).some(([nx,ny])=>{
      const tile=this.getTile(nx,ny);
      return tile && tile.el.querySelector(".santaPiece.onboard");
    });
  }
}

/* ===== UI Helpers ===== */
function typeWriter(el,text,speed=25){
  el.textContent="";el.style.opacity="1";let i=0;
  (function t(){ if(i<text.length){ el.textContent+=text[i++]; setTimeout(t,speed);} })();
}
function speakSanta(t){ typeWriter(document.getElementById("speechBubble"),t,20); }
function createSnowflakes(c,n=40){
  for(let i=0;i<n;i++){
    const f=document.createElement("div");f.classList.add("snowflake");
    const s=Math.random()*4+2;f.style.width=`${s}px`;f.style.height=`${s}px`;
    f.style.left=`${Math.random()*100}%`;f.style.animationDuration=`${5+Math.random()*5}s`;
    f.style.animationDelay=`${Math.random()*5}s`;c.appendChild(f);
    f.addEventListener("animationend",()=>{c.removeChild(f);createSnowflakes(c,1);});
  }
}

/* ===== Drag & Touch (mit Hover-Highlight) ===== */
function enableDragAndTouch(piece,board){
  let currentTile=null;

  function place(tileEl){
    if(!tileEl || tileEl.classList.contains("center")){
      speakSanta("Dieses Feld ist ungültig! 🔥");return;
    }
    const x=parseInt(tileEl.dataset.x,10);
    const y=parseInt(tileEl.dataset.y,10);

    // Guard nur in unterster Reihe
    if(piece.id==="guard" && y!==board.size){
      speakSanta("Der Guard darf nur in deiner ersten Reihe (unten) platziert werden! ❄️");return;
    }
    // König ohne Nachbarn
    if(piece.id==="king" && board.hasNeighborPiece(x,y)){
      speakSanta("Der König braucht Raum – keine Nachbarfelder erlaubt! 👑");return;
    }
    // Feld frei?
    if(tileEl.querySelector(".santaPiece.onboard")){
      speakSanta("Dieses Feld ist bereits besetzt! ⚠️");return;
    }

    tileEl.appendChild(piece);
    piece.classList.add("onboard");   // macht die Figur vollflächig + sichtbar
    piece.dataset.x=x; piece.dataset.y=y;
    piece.placed=true;
    speakSanta("Gut gemacht!");
    checkBothPlaced();
  }

  // Desktop D&D mit Highlight
  piece.addEventListener("dragstart",e=>{
    e.dataTransfer.setData("piece",piece.id);
    piece.style.opacity="0.6";
  });
  piece.addEventListener("dragend",()=>{ piece.style.opacity="1"; });

  document.querySelectorAll(".tile").forEach(t=>{
    t.addEventListener("dragover",e=>e.preventDefault());
    t.addEventListener("dragenter",()=> t.classList.add("highlight"));
    t.addEventListener("dragleave",()=> t.classList.remove("highlight"));
    t.addEventListener("drop",e=>{
      t.classList.remove("highlight");
      const pid=e.dataTransfer.getData("piece");
      if(pid===piece.id) place(t);
    });
  });

  // Touch
  piece.addEventListener("touchstart",e=>{ piece.classList.add("dragging"); e.preventDefault(); },{passive:false});
  piece.addEventListener("touchmove",e=>{
    const touch=e.touches[0];
    const el=document.elementFromPoint(touch.clientX,touch.clientY);
    const tile=el && el.closest ? el.closest(".tile") : (el?.classList?.contains("tile")?el:null);
    if(tile){
      if(currentTile && currentTile!==tile) currentTile.classList.remove("highlight");
      currentTile=tile; tile.classList.add("highlight");
    }
  },{passive:true});
  piece.addEventListener("touchend",()=>{
    if(currentTile){
      currentTile.classList.remove("highlight");
      place(currentTile);
      currentTile=null;
    }
    piece.classList.remove("dragging");
  });
}

/* ===== Computerzug – Figuren sichtbar (z-index/translateZ greift dank .onboard) ===== */
function computerTurn(board){
  const enemyKing=document.createElement("div");
  enemyKing.className="santaPiece king enemy onboard"; enemyKing.textContent="👑";
  const enemyGuard=document.createElement("div");
  enemyGuard.className="santaPiece guard enemy onboard"; enemyGuard.textContent="🛡️";

  // Guard oben (Reihe 1)
  const gx=1+Math.floor(Math.random()*board.size);
  const gTile=board.getTile(gx,1);
  gTile.el.appendChild(enemyGuard);

  // König in Reihe 2 ohne Nachbarn
  let placed=false, tries=0;
  while(!placed && tries<200){
    tries++;
    const x=1+Math.floor(Math.random()*board.size);
    const y=2;
    if(!board.hasNeighborPiece(x,y)){
      const tile=board.getTile(x,y);
      if(tile && !tile.el.querySelector(".santaPiece.onboard")){
        tile.el.appendChild(enemyKing);
        placed=true;
      }
    }
  }
  speakSanta("Santa Frost hat seine Figuren platziert! 🎅");
}

/* ===== Flow ===== */
function checkBothPlaced(){
  const k=document.getElementById("king"), g=document.getElementById("guard");
  if(k.placed && g.placed) setTimeout(()=>computerTurn(window.gameBoard), 900);
}

/* ===== Init ===== */
document.addEventListener("DOMContentLoaded",()=>{
  const b=document.getElementById("speechBubble");
  const king=document.getElementById("king"), guard=document.getElementById("guard");
  window.gameBoard=new Board(9);

  const t1="Willkommen, Sterblicher. Die Mitternacht ist still, und der Schnee tanzt … 🎅";
  const t2="Platziere den König (ohne Nachbarn) und den Guard (nur ganz unten) auf dem Brett. 👑🛡️";

  b.textContent="";
  document.getElementById("board").addEventListener("animationend",()=>{
    typeWriter(b,t1,30);
    setTimeout(()=>{
      king.classList.add("show"); guard.classList.add("show");
      setTimeout(()=> typeWriter(b,t2,25), 1800);
    }, 6000);
  },{once:true});

  createSnowflakes(document.getElementById("snow"));
  enableDragAndTouch(king,window.gameBoard);
  enableDragAndTouch(guard,window.gameBoard);
});
</script>
</body>
</html>
